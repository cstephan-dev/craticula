# Docs site (story #1666, task #2836): builds the static site from the repository's own Markdown (scripts/build_site.py) on every
# pull request and every push to main, and fails on a dead, private or unresolved link. Its own workflow, not a job of ci.yml,
# because the branch ruleset requires the ci.yml checks `build` and `test` by name and scripts/test_workflows.py pins them.
# The `deploy` job publishes to GitHub Pages only on a push to main and only when the repository variable DOCS_PAGES is "true",
# so a repository whose Pages are not switched on stays green (docs/compliance/pages-craticula.md has the maker's steps).
# No secret, a read-only token except in `deploy`, every action pinned to a commit SHA (scripts/test_workflows.py checks that).
name: docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The generator's own tests, then the site itself: exit 1 on a dead link, an unknown anchor or a private path.
      - name: Test the site generator
        run: python3 scripts/test_build_site.py

      - name: Build the site
        run: python3 scripts/build_site.py --out site/_build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
        with:
          path: site/_build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
