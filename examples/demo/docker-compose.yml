# Demo databases for examples/demo. Local, throw-away credentials (user demo / password demo / database demo);
# nothing here is a secret. Ports are bound to localhost only. Override a host port when it is taken:
#   DEMO_PG_PORT=55434 DEMO_MONGO_PORT=57018 docker compose up -d
#
# Optional engines use compose profiles. A service with `profiles: [...]` is NOT started by a plain `docker compose up -d`;
# it starts only when one of its profiles is asked for:
#   docker compose --profile sqlserver up -d   one engine, by its own profile
#   docker compose --profile engines up -d     every optional engine at once (the umbrella profile)
#   docker compose --profile mysql up -d       the same for MySQL
#   docker compose --profile opensearch up -d --wait   the same for OpenSearch (waits for the cluster health check)
# Every optional service lists its own profile AND `engines`. postgres and mongo have no profile: they always start.
# The API lists an optional engine only when its connection variable is set (see README.md), and
# `dotnet run --project Api -- seed <provider>` fills just the named provider. Today `sqlserver`, `mysql` and `opensearch`
# are the real optional services (`engines` starts all three). Example block (commented out):
#
#   example-engine:
#     image: example/engine:1
#     profiles: ["example", "engines"]
#     ports:
#       - "127.0.0.1:${DEMO_EXAMPLE_PORT:-51000}:5000"
#     healthcheck:
#       test: ["CMD-SHELL", "example-ping"]
#       interval: 5s
#       timeout: 3s
#       retries: 20
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:${DEMO_PG_PORT:-55433}:5432"
    volumes:
      - demo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:${DEMO_MONGO_PORT:-57017}:27017"
    volumes:
      - demo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SQL Server 2022 (the image the library's Docker tier uses). RUNNING THIS PROFILE ACCEPTS MICROSOFT'S SQL SERVER LICENCE:
  # ACCEPT_EULA=Y below is that acceptance (Developer edition, free for development and testing, never for production).
  # The `sa` password is a local throw-away credential like the demo/demo ones above, only reachable on 127.0.0.1; it
  # satisfies SQL Server's complexity rules. DEMO_READER_PASSWORD is not read by the container: it is the password of the read-only
  # `demo_reader` login that `seed sqlserver` creates and the API uses (README.md builds DEMO_SQLSERVER from it); `sa` is for the seed only.
  # The container needs about 2 GB of RAM; it is ready in seconds on a fast machine, and the healthcheck allows a slow one about three minutes.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    profiles: ["sqlserver", "engines"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Demo-Local-2499"
      DEMO_READER_PASSWORD: "Demo-Read-2525"
    ports:
      - "127.0.0.1:${DEMO_SQLSERVER_PORT:-51433}:1433"
    volumes:
      - demo-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # MySQL 8.4 (the image the library's Docker tier uses). MySQL Community needs no licence acceptance. MariaDB is not covered:
  # its collations and some behaviour differ, and the library has no fixtures for it. User demo / password demo / database demo
  # are local throw-away credentials like the PostgreSQL ones, only reachable on 127.0.0.1; the root password is random and never
  # needed (the root account is not used). The first start initialises the data directory (tens of seconds on a slow disk), so the
  # healthcheck waits before it counts failures.
  mysql:
    image: mysql:8.4.11
    profiles: ["mysql", "engines"]
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${DEMO_MYSQL_PORT:-53306}:3306"
    volumes:
      - demo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u demo -pdemo --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  # OpenSearch 2.19 (the image the library's Docker tier uses), single node, Apache-2.0, no licence acceptance.
  # DEMO ONLY: the security plugin is switched off (no TLS, no login), so the port is bound to 127.0.0.1 and must stay there;
  # never publish this service on another interface. There are no credentials at all, so the API setting is a plain URL.
  # The JVM heap is fixed at 512 MB. The first start takes tens of seconds, so the healthcheck waits before it counts failures.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: ["opensearch", "engines"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${DEMO_OPENSEARCH_PORT:-59200}:9200"
    volumes:
      - demo-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s

volumes:
  demo-pg-data:
  demo-mongo-data:
  demo-sqlserver-data:
  demo-mysql-data:
  demo-opensearch-data:
